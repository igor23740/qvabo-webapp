<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Nano-Banana 2.1">
  <!-- Плейсхолдер витрины Nano-Banana 2.1 (09.10.2026): палитра фронта QVABO, как у плейсхолдера GPT Image 2.5
       (bg #1a1a2e/#252542, accent #7c3aed/#8b5cf6, text #fff/#9ca3af, border #3d3d5c). Шрифт без Inter (правило владельца).
       Заменяется картинкой владельца (nano-banana-21-preview.webp) после первой генерации. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252542"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1232" height="672" rx="28" fill="none" stroke="#3d3d5c" stroke-width="3"/>
  <rect x="24" y="24" width="1232" height="8" rx="4" fill="url(#acc)"/>
  <g transform="translate(640 250)">
    <path d="M 0 -130 C 14 -48 48 -14 130 0 C 48 14 14 48 0 130 C -14 48 -48 14 -130 0 C -48 -14 -14 -48 0 -130 Z" fill="url(#acc)"/>
    <path d="M 132 -96 C 137 -76 146 -67 166 -62 C 146 -57 137 -48 132 -28 C 127 -48 118 -57 98 -62 C 118 -67 127 -76 132 -96 Z" fill="#8b5cf6"/>
  </g>
  <text x="640" y="470" text-anchor="middle" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Nano-Banana 2.1</text>
  <text x="640" y="530" text-anchor="middle" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="30" fill="#9ca3af">Google Gemini · новая версия, после покупки пакета</text>
  <text x="640" y="610" text-anchor="middle" font-family="Montserrat, Segoe UI, Arial, sans-serif" font-size="26" fill="#8b5cf6">Пример появится здесь после первой генерации</text>
</svg>
